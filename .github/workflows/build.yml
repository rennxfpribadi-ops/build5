
name: Build Flutter APK & AAB

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Pilih hasil build"
        required: true
        type: choice
        options:
          - both
          - apk
          - aab
        default: both

jobs:
  build:
    name: Flutter Release Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Flutter 3.38.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.0"
          channel: stable
          cache: true

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Install Dependencies
        run: flutter pub get

      - name: Setup Android Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE_BASE64"
          mkdir -p android
          echo "$KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks

          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Build APK Release
        if: ${{ inputs.build_type == 'both' || inputs.build_type == 'apk' }}
        run: flutter build apk --release

      - name: Build AAB Release
        if: ${{ inputs.build_type == 'both' || inputs.build_type == 'aab' }}
        run: flutter build appbundle --release

      - name: Upload APK
        if: ${{ inputs.build_type == 'both' || inputs.build_type == 'apk' }}
        uses: actions/upload-artifact@v4
        with:
          name: Flutter-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB
        if: ${{ inputs.build_type == 'both' || inputs.build_type == 'aab' }}
        uses: actions/upload-artifact@v4
        with:
          name: Flutter-Release-AAB
          path: build/app/outputs/bundle/release/app-release.aab
