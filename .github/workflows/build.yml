
name: XF Server Flutter Build

on:
  workflow_dispatch:
    inputs:
      jobId:
        description: "Build Job ID"
        required: true
        type: string

      payload:
        description: "JSON payload containing ZIP URL"
        required: true
        type: string

      build_type:
        description: "Build output"
        required: true
        type: choice
        options:
          - both
          - apk
          - aab
        default: both

      perfMode:
        description: "Build performance mode"
        required: false
        type: string
        default: fast

      engine:
        description: "Build engine"
        required: false
        type: string
        default: flutter

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: XF Flutter Build
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Worker
        uses: actions/checkout@v4

      - name: Read Build Payload
        id: payload
        env:
          PAYLOAD: ${{ inputs.payload }}
        run: |
          URL=$(echo "$PAYLOAD" | jq -r '
            if type == "object" then
              (.zip_url // .download_url // .url // empty)
            else empty end
          ')

          if [ -z "$URL" ]; then
            URL="$PAYLOAD"
          fi

          if [[ "$URL" != http://* && "$URL" != https://* ]]; then
            echo "ERROR: ZIP URL tidak ditemukan dalam payload."
            exit 1
          fi

          echo "zip_url=$URL" >> "$GITHUB_OUTPUT"

      - name: Download Flutter Base
        run: |
          mkdir -p source
          curl -fL --retry 3 \
            "${{ steps.payload.outputs.zip_url }}" \
            -o source/base.zip

          unzip -oq source/base.zip -d source/extracted

          PROJECT_DIR=$(find source/extracted \
            -name pubspec.yaml -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: pubspec.yaml tidak ditemukan!"
            exit 1
          fi

          mkdir -p project
          cp -a "$PROJECT_DIR"/. project/

          test -f project/pubspec.yaml

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter 3.38.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.0"
          channel: stable
          cache: true

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Install Dependencies
        working-directory: project
        run: flutter pub get

      - name: Setup Release Keystore
        working-directory: project
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE_BASE64"
          mkdir -p android

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > android/upload-keystore.jks

          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Build APK Release
        if: ${{ inputs.build_type == 'both' || inputs.build_type == 'apk' }}
        working-directory: project
        run: flutter build apk --release

      - name: Build AAB Release
        if: ${{ inputs.build_type == 'both' || inputs.build_type == 'aab' }}
        working-directory: project
        run: flutter build appbundle --release

      - name: Upload APK Artifact
        if: ${{ inputs.build_type == 'both' || inputs.build_type == 'apk' }}
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.jobId }}
          path: project/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 3

      - name: Upload AAB Artifact
        if: ${{ inputs.build_type == 'both' || inputs.build_type == 'aab' }}
        uses: actions/upload-artifact@v4
        with:
          name: aab-${{ inputs.jobId }}
          path: project/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 3
